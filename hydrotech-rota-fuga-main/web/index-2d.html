<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HydroTech · Rota de Fuga (2D)</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root {
    --bg: #09131F; --card: #0F2036; --elev: #162B46; --borda: rgba(255,255,255,.08);
    --txt: #F1F5F9; --txt2: #8AA6C1; --mut: #4F6D8A;
    --azul: #3B82F6; --verde: #10B981; --verm: #DC2626; --amar: #D97706;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body { font-family: Inter, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--txt); display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--borda); background: #060E1A; }
  header b { color: var(--azul); }
  .layout { flex: 1; display: grid; grid-template-columns: 380px 1fr; min-height: 0; }
  aside { background: var(--card); border-right: 1px solid var(--borda); overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
  #mapa { min-height: 300px; }
  h2 { font-size: .7rem; text-transform: uppercase; letter-spacing: .08em; color: var(--mut); margin-bottom: 6px; }
  .btn { width: 100%; padding: 13px; border-radius: 10px; border: 0; background: var(--verm); color: #fff; font-weight: 800; font-size: .95rem; letter-spacing: .02em; cursor: pointer; }
  .btn:disabled { opacity: .6; cursor: wait; }
  .modo { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .modo button { padding: 9px; border-radius: 8px; border: 1px solid var(--borda); background: var(--elev); color: var(--txt2); font-weight: 600; cursor: pointer; }
  .modo button.ativo { border-color: var(--azul); color: var(--txt); background: rgba(59,130,246,.15); }
  .dica { font-size: .78rem; color: var(--txt2); line-height: 1.5; }
  .aviso { padding: 10px 12px; border-radius: 8px; font-size: .82rem; line-height: 1.4; background: rgba(217,119,6,.15); color: #FBBF24; }
  .aviso.grave { background: rgba(220,38,38,.18); color: #FCA5A5; font-weight: 700; }
  .destino { padding: 14px; border-radius: 12px; background: var(--elev); border-left: 4px solid var(--verde); }
  .destino .nome { font-size: 1.05rem; font-weight: 800; }
  .destino .tipo { font-size: .78rem; color: var(--txt2); margin-top: 2px; }
  .numeros { display: flex; gap: 18px; margin-top: 10px; }
  .numeros div { font-size: 1.3rem; font-weight: 800; }
  .numeros span { display: block; font-size: .68rem; color: var(--mut); font-weight: 600; text-transform: uppercase; }
  .links { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .links a { text-align: center; padding: 10px; border-radius: 8px; background: var(--azul); color: #fff; text-decoration: none; font-weight: 700; font-size: .85rem; }
  .links a.waze { background: #33CCFF; color: #062033; }
  ol { padding-left: 20px; display: flex; flex-direction: column; gap: 6px; font-size: .85rem; }
  ol li span { color: var(--mut); font-size: .75rem; }
  .alt { font-size: .8rem; color: var(--txt2); padding: 8px 0; border-bottom: 1px solid var(--borda); }
  .vazio { color: var(--mut); font-size: .85rem; }
  @media (max-width: 800px) {
    .layout { grid-template-columns: 1fr; grid-template-rows: 45vh auto; }
    #mapa { order: -1; }
    aside { border-right: 0; border-top: 1px solid var(--borda); }
  }
</style>
</head>
<body>
<p style="padding:8px 16px;background:#713f12;color:#fff;font-size:.8rem">Simulação acadêmica: riscos, alertas e rotas não representam uma emergência real. Siga a Defesa Civil.</p>
<header>
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#3B82F6" stroke-width="2.5" stroke-linecap="round"><path d="M2 12c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 2.6 0 2.4 2 5 2 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/><path d="M2 6c.6.5 1.2 1 2.5 1C7 7 7 5 9.5 5c2.6 0 2.4 2 5 2 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/></svg>
  <span>HydroTech <b>Rota de Fuga</b></span>
</header>

<div class="layout">
  <aside>
    <button id="btnLocal" class="btn">📍 Encontrar rota segura</button>
    <div class="modo">
      <button data-modo="pe" class="ativo">🚶 A pé</button>
      <button data-modo="carro">🚗 De carro</button>
    </div>
    <p class="dica">Usa a sua localização atual. Sem GPS? Clique no mapa para marcar onde você está.</p>
    <div id="resultado"><p class="vazio">Nenhuma rota calculada ainda.</p></div>
  </aside>
  <div id="mapa"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const params = new URLSearchParams(location.search);
let modo = params.get('modo') === 'carro' ? 'carro' : 'pe';
let origem = null;
const alerta = /^\d+(,\d+)*$/.test(params.get('alerta') || '') ? params.get('alerta') : null;
const sufixoAlerta = alerta ? `&alerta=${alerta}` : '';

const mapa = L.map('mapa').setView([-14.235, -51.925], 4);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19, attribution: '&copy; OpenStreetMap'
}).addTo(mapa);
const camadaZonas = L.layerGroup().addTo(mapa);
const camadaRota = L.layerGroup().addTo(mapa);

const iconeCor = (cor) => L.divIcon({
  className: '', iconSize: [18, 18], iconAnchor: [9, 9],
  html: `<div style="width:18px;height:18px;border-radius:50%;background:${cor};border:3px solid #fff;box-shadow:0 0 6px rgba(0,0,0,.5)"></div>`
});

const fmtDist = (m) => m >= 1000 ? (m / 1000).toFixed(1).replace('.', ',') + ' km' : Math.round(m) + ' m';
const fmtTempo = (s) => s < 3600 ? Math.max(1, Math.round(s / 60)) + ' min' : Math.floor(s / 3600) + 'h' + String(Math.round(s % 3600 / 60)).padStart(2, '0');
const esc = (t) => String(t ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function desenharZonas(zonas) {
  camadaZonas.clearLayers();
  zonas.forEach(z => {
    L.circle([z.lat, z.lng], { radius: z.raio_m, color: '#DC2626', fillColor: '#DC2626', fillOpacity: .25, weight: 2 })
      // tooltip e não popup: popup engole o clique que marca a pessoa dentro da zona
      .bindTooltip(`<b>Área de risco</b><br>${esc(z.rio)} — ${esc(z.descricao)}`, { sticky: true })
      .addTo(camadaZonas);
  });
}

async function carregarZonas() {
  try {
    const r = await fetch('/zonas-risco');
    if (r.ok) desenharZonas(await r.json());
  } catch {}
}

async function calcular() {
  if (!origem) return;
  const btn = document.getElementById('btnLocal');
  const res = document.getElementById('resultado');
  btn.disabled = true; btn.textContent = 'Calculando rota...';
  res.innerHTML = '<p class="vazio">Procurando o local seguro mais próximo...</p>';
  camadaRota.clearLayers();
  L.marker(origem, { icon: iconeCor('#3B82F6') }).bindPopup('Você está aqui').addTo(camadaRota);
  mapa.setView(origem, Math.max(mapa.getZoom(), 15));

  try {
    const r = await fetch(`/rota-fuga?lat=${origem[0]}&lng=${origem[1]}&modo=${modo}${sufixoAlerta}`);
    const d = await r.json();
    if (!r.ok) throw new Error(d.detail || 'Erro ao calcular a rota');

    desenharZonas(d.zonas_risco);
    // sem rota (serviço de mapa fora): só a linha reta tracejada
    const linha = d.rota
      ? L.geoJSON(d.rota.geometria, { style: { color: '#10B981', weight: 6, opacity: .9 } }).addTo(camadaRota)
      : L.polyline([origem, [d.destino.lat, d.destino.lng]], { color: '#10B981', weight: 3, dashArray: '8 8' }).addTo(camadaRota);
    L.marker([d.destino.lat, d.destino.lng], { icon: iconeCor('#10B981') })
      .bindPopup(`<b>${esc(d.destino.nome)}</b><br>${esc(d.destino.tipo)}`).addTo(camadaRota);
    d.alternativas.forEach(a => L.marker([a.destino.lat, a.destino.lng], { icon: iconeCor('#64748B') })
      .bindPopup(`<b>${esc(a.destino.nome)}</b><br>${esc(a.destino.tipo)} · ${fmtDist(a.distancia_m)}`).addTo(camadaRota));
    mapa.fitBounds(linha.getBounds().extend(origem), { padding: [40, 40], maxZoom: 16 });

    const avisos = d.avisos.map((a, i) =>
      `<div class="aviso ${i === 0 && d.dentro_de_zona_risco ? 'grave' : ''}">${esc(a)}</div>`).join('');
    const altura = d.destino.acima_do_risco_m != null
      ? `<div>${d.destino.acima_do_risco_m >= 0 ? '+' : ''}${Math.round(d.destino.acima_do_risco_m)} m<span>acima do rio</span></div>` : '';
    res.innerHTML = `
      ${avisos}
      <div style="margin-top:${avisos ? 14 : 0}px">
        <h2>Vá para</h2>
        <div class="destino">
          <div class="nome">${esc(d.destino.nome)}</div>
          <div class="tipo">${esc(d.destino.tipo)}${d.destino.endereco ? ' · ' + esc(d.destino.endereco) : ''}</div>
          <div class="numeros">
            ${d.rota
              ? `<div>${fmtTempo(d.rota.duracao_s)}<span>${modo === 'pe' ? 'a pé' : 'de carro'}</span></div>
                 <div>${fmtDist(d.rota.distancia_m)}<span>distância</span></div>`
              : `<div>${fmtDist(d.destino.distancia_linha_reta_m)}<span>em linha reta</span></div>`}
            ${altura}
          </div>
        </div>
      </div>
      <div class="links" style="margin-top:12px">
        <a href="${d.links.google_maps}" target="_blank" rel="noopener">Google Maps</a>
        <a class="waze" href="${d.links.waze}" target="_blank" rel="noopener">Waze</a>
      </div>
      ${d.rota ? `<div style="margin-top:16px"><h2>Passo a passo</h2>
        <ol>${d.rota.passos.map(p => `<li>${esc(p.instrucao)} ${p.distancia_m ? `<span>(${fmtDist(p.distancia_m)})</span>` : ''}</li>`).join('')}</ol>
      </div>` : ''}
      ${d.alternativas.length ? `<div style="margin-top:16px"><h2>Outras opções</h2>${d.alternativas.map(a =>
        `<div class="alt">${esc(a.destino.nome)} · ${fmtTempo(a.duracao_s)} · ${fmtDist(a.distancia_m)}${a.cruza_zona_risco ? ' ⚠️ passa por área de risco' : ''}</div>`).join('')}</div>` : ''}`;
  } catch (e) {
    res.innerHTML = `<div class="aviso grave">${esc(e.message)}. Siga as orientações da Defesa Civil.</div>`;
  } finally {
    btn.disabled = false; btn.textContent = '📍 Encontrar rota segura';
  }
}

function usarGPS() {
  if (!navigator.geolocation) {
    document.getElementById('resultado').innerHTML = '<div class="aviso">Seu navegador não oferece localização. Clique no mapa onde você está.</div>';
    return;
  }
  const btn = document.getElementById('btnLocal');
  btn.disabled = true; btn.textContent = 'Obtendo localização...';
  navigator.geolocation.getCurrentPosition(
    (pos) => { origem = [pos.coords.latitude, pos.coords.longitude]; calcular(); },
    () => {
      btn.disabled = false; btn.textContent = '📍 Encontrar rota segura';
      document.getElementById('resultado').innerHTML = '<div class="aviso">Não consegui sua localização. Clique no mapa onde você está.</div>';
    },
    { enableHighAccuracy: true, timeout: 15000 }
  );
}

document.getElementById('btnLocal').addEventListener('click', usarGPS);
document.querySelectorAll('.modo button[data-modo]').forEach(b => {
  b.classList.toggle('ativo', b.dataset.modo === modo);
  b.addEventListener('click', () => {
    modo = b.dataset.modo;
    document.querySelectorAll('.modo button[data-modo]').forEach(x => x.classList.toggle('ativo', x === b));
    calcular();
  });
});
mapa.on('click', (e) => { origem = [e.latlng.lat, e.latlng.lng]; calcular(); });

carregarZonas();
// ?lat=&lng= calcula direto; ?auto=1 (link do alerta) já pede o GPS
if (params.get('lat') && params.get('lng')) {
  origem = [parseFloat(params.get('lat')), parseFloat(params.get('lng'))];
  calcular();
} else if (params.get('auto') === '1') {
  usarGPS();
}
</script>
</body>
</html>
